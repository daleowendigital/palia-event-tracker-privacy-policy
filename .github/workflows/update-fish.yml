name: Update fish data

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate fish.json
        run: npm run fish:update

      - name: Sync root fish.json to data-site (optional mirror)
        run: |
          mkdir -p data-site
          echo "Syncing fish.json -> data-site/fish.json"
          cp fish.json data-site/fish.json
          else
            echo "No data-site/fish.json found, leaving root fish.json as-is"
          fi

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add fish.json data-site/fish.json src/fishVersion.ts pull-fish.mjs tools/bumpFishVersion.js tools/enrichFishImages.mjs package.json package-lock.json
            git commit -m "Auto-update fish data"
            git push
          else
            echo "No changes"
          fi
