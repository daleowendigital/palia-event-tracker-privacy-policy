name: Update fish data

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and validate isolated review candidate
        run: node tools/buildFishCandidate.mjs "$RUNNER_TEMP/fish-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # Successful artifacts are proposals only; an Owner must approve their incorporation.
      - name: Upload validated candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: fish-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fish-review-${{ github.run_id }}-${{ github.run_attempt }}/review/fish.json
            ${{ runner.temp }}/fish-review-${{ github.run_id }}-${{ github.run_attempt }}/review/docs/fish.json
            ${{ runner.temp }}/fish-review-${{ github.run_id }}-${{ github.run_attempt }}/review/docs/fish-images/*
            ${{ runner.temp }}/fish-review-${{ github.run_id }}-${{ github.run_attempt }}/review/src/fishVersion.ts

      - name: Upload review or failure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fish-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/fish-review-${{ github.run_id }}-${{ github.run_attempt }}/review-report.json
