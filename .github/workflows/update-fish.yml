name: Update fish data

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate fish.json
        run: npm run fish:update

      - name: Enrich fish.json with image URLs
        run: node tools/enrichFishImages.mjs

      - name: Sync root fish.json to data-site (optional mirror)
        shell: bash
        run: |
          if [ -f fish.json ]; then
            mkdir -p data-site
            echo "Syncing fish.json -> data-site/fish.json"
            cp -f fish.json data-site/fish.json
          else
            echo "fish.json not found, skipping mirror"
          fi

      - name: Commit & push if changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Add whatever files your scripts actually touch
            git add fish.json data-site/fish.json src/fishVersion.ts package.json package-lock.json tools/enrichFishImages.mjs tools/bumpFishVersion.js || true

            git commit -m "Auto-update fish data"
            git push
          else
            echo "No changes"
          fi
